<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 6: Student Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .table-container {
            width: 100%;
            max-width: 700px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #343a40;
            color: white;
            text-transform: uppercase;
            font-size: 14px;
        }

        tr:hover {
            background-color: #f1f1f1;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <h2>Student List</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Grade</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Muhammad Absar Khan</td>
                    <td>19</td>
                    <td>A*</td>
                    <td>absar@example.com</td>
                </tr>
                <tr>
                    <td>Ali Ahmed</td>
                    <td>18</td>
                    <td>A</td>
                    <td>ali.ahmed@example.com</td>
                </tr>
                <tr>
                    <td>Sara Malik</td>
                    <td>19</td>
                    <td>A*</td>
                    <td>sara.m@example.com</td>
                </tr>
                <tr>
                    <td>Usman Tariq</td>
                    <td>20</td>
                    <td>B</td>
                    <td>usman.t@example.com</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
