<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        
        .product-card {
            background-color: #ffffff;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }

        
        .product-title {
            font-size: 20px;
            margin: 12px 0 8px;
            color: #333;
        }

        
        .product-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        
        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 16px;
        }

        
        .buy-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .buy-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    
    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" alt="Wireless Headphones">
        <h2 class="product-title">Wireless Headphones</h2>
        <p class="product-description">High-quality sound with noise cancellation and up to 30 hours of battery life.</p>
        <div class="product-price">$99.99</div>
        <button class="buy-btn">Buy Now</button>
    </div>

</body>
</html>
